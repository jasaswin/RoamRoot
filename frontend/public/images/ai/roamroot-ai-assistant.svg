<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">RoamRoot AI Assistant</title>
  <desc id="desc">Friendly RoamRoot travel assistant avatar with a forest green travel hat, backpack and chat bubble.</desc>

  <defs>
    <clipPath id="round">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#F7F3EA"/>

  <g clip-path="url(#round)">
    <!-- soft landscape -->
    <path d="M0 410 C90 340 150 350 220 395 C300 445 365 350 512 385 L512 512 L0 512 Z"
          fill="#A8BDA5"/>
    <path d="M0 445 C110 390 190 420 275 450 C365 482 430 405 512 425 L512 512 L0 512 Z"
          fill="#6B8F71"/>

    <!-- foliage -->
    <path d="M62 410 C38 372 43 333 67 308 C78 349 82 380 76 411Z" fill="#183A37"/>
    <path d="M91 413 C72 372 82 340 108 318 C112 354 108 387 101 414Z" fill="#6B8F71"/>
    <path d="M430 412 C412 371 421 338 448 316 C451 354 446 387 438 414Z" fill="#183A37"/>

    <!-- backpack -->
    <path d="M133 330 C130 286 153 260 190 258 L220 258 C254 262 273 289 270 330
             L258 427 L139 427 Z" fill="#183A37"/>
    <path d="M153 316 C157 280 174 266 202 266 C229 266 246 282 250 316"
          fill="none" stroke="#DCCDB8" stroke-width="13" stroke-linecap="round"/>
    <rect x="158" y="333" width="94" height="78" rx="18" fill="#6B8F71"/>
    <path d="M176 350 H234" stroke="#A8BDA5" stroke-width="9" stroke-linecap="round"/>

    <!-- shoulders -->
    <path d="M151 292 C128 302 112 329 111 365" fill="none"
          stroke="#C86B4A" stroke-width="20" stroke-linecap="round"/>
    <path d="M250 294 C274 304 287 330 288 361" fill="none"
          stroke="#C86B4A" stroke-width="20" stroke-linecap="round"/>

    <!-- neck -->
    <path d="M180 246 V278 C193 291 220 291 232 277 V244 Z" fill="#D9A07C"/>

    <!-- face -->
    <path d="M151 151 C151 106 178 78 218 78 C263 78 287 108 284 156
             C281 213 253 257 218 260 C183 257 153 213 151 151Z"
          fill="#E7B08C"/>

    <!-- hair -->
    <path d="M151 158 C132 132 138 91 167 69 C193 50 237 51 263 72
             C286 90 293 123 283 157 C270 137 259 123 239 116
             C218 137 183 145 151 158Z" fill="#202522"/>
    <path d="M157 166 C139 151 132 125 142 99 C125 121 122 157 140 182
             C147 192 153 196 160 198Z" fill="#202522"/>

    <!-- hat -->
    <path d="M151 91 C157 52 184 31 222 31 C263 31 291 55 295 94
             C259 78 196 77 151 91Z" fill="#183A37"/>
    <path d="M142 91 C176 70 250 70 307 92 C317 96 317 108 306 112
             C252 101 194 100 143 110 C129 113 126 99 142 91Z" fill="#102B28"/>

    <!-- hat emblem -->
    <circle cx="222" cy="70" r="21" fill="#F7F3EA"/>
    <path d="M207 78 L222 55 L237 78 L228 72 L222 80 L216 72 Z" fill="#183A37"/>

    <!-- eyes -->
    <ellipse cx="185" cy="165" rx="6" ry="8" fill="#202522"/>
    <ellipse cx="245" cy="165" rx="6" ry="8" fill="#202522"/>

    <!-- smile -->
    <path d="M197 194 C208 205 223 205 234 194" fill="none"
          stroke="#9B5D4B" stroke-width="5" stroke-linecap="round"/>

    <!-- scarf -->
    <path d="M171 235 C193 250 237 252 262 235 L267 267
             C239 283 192 282 166 265Z" fill="#C86B4A"/>
    <path d="M242 264 L274 303 L248 312 L226 274Z" fill="#E5A58F"/>

    <!-- chat bubble -->
    <path d="M316 151 C316 116 344 91 381 91 H430 C464 91 486 115 486 149
             V185 C486 219 462 241 429 241 H381 L350 263 L354 235
             C331 226 316 207 316 185Z" fill="#183A37"/>
    <circle cx="363" cy="169" r="8" fill="#F7F3EA"/>
    <circle cx="391" cy="169" r="8" fill="#F7F3EA"/>
    <circle cx="419" cy="169" r="8" fill="#F7F3EA"/>

    <!-- small journey path -->
    <path d="M330 337 C360 312 389 314 405 336 C419 356 406 377 383 378
             C358 380 349 398 363 414"
          fill="none" stroke="#F7F3EA" stroke-width="10"
          stroke-linecap="round"/>

    <!-- decorative sun -->
    <circle cx="420" cy="304" r="24" fill="#C86B4A" opacity=".9"/>
  </g>
</svg>
